<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex">
<title>Offline · Authentic Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f4f4f5; min-height: 100vh;
    display: grid; place-items: center; padding: 20px;
    color: #18181b; line-height: 1.6;
  }
  .box {
    background: #fff; padding: 44px 32px; border-radius: 16px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.08);
  }
  .icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg,#fee2e2,#fecaca);
    display: grid; place-items: center; margin: 0 auto 22px;
    font-size: 34px;
  }
  h1 { font-size: 20px; font-weight: 700; color: #18181b; margin-bottom: 12px; }
  p  { font-size: 13.5px; color: #71717a; margin-bottom: 24px; line-height: 1.7; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 22px; border-radius: 8px;
    background: #4f46e5; color: #fff; border: none; cursor: pointer;
    font-size: 13.5px; font-weight: 600; font-family: inherit;
    text-decoration: none; transition: .15s;
  }
  .btn:hover { background: #4f46e5; }
  .btn:active { transform: scale(.98); }
  .note {
    margin-top: 22px; padding-top: 20px;
    border-top: 1px solid #f4f4f5;
    font-size: 11.5px; color: #a1a1aa; line-height: 1.6;
  }
  .note strong { color: #71717a; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #f8fafc; }
    .box { background: #1e293b; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    h1 { color: #f8fafc; }
    .note { border-top-color: #334155; }
    .note strong { color: #cbd5e1; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Anda Sedang Offline</h1>
    <p>
      Koneksi internet tidak tersedia.<br>
      Halaman yang sudah pernah Anda buka mungkin masih bisa diakses dari cache.
    </p>
    <button class="btn" onclick="location.reload()">🔄 Coba Lagi</button>
    <div class="note">
      <strong id="shopName">Authentic Gold</strong><br>
      Aplikasi ini bekerja offline untuk halaman yang sudah dikunjungi.
    </div>
  </div>
  <script>
    try {
      const name = localStorage.getItem('pwa_shop_name');
      if (name) document.getElementById('shopName').textContent = name;
    } catch (e) {}
  </script>
</body>
</html>
